// CI-only extras shared by both Minecraft versions:
// - `-Pgametest` builds the in-game test into the mod (see common/src/gametest)
// - runProductionClientGameTest (in each build.gradle) starts the real game with it
// - dumpApi prints the Minecraft signatures 3vhy relies on (api-dump.gradle)

ext.gametestEnabled = providers.gradleProperty('gametest').isPresent()

if (gametestEnabled) {
	sourceSets.main.java.srcDir '../common/src/gametest/java'
}

dependencies {
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.ext.fabricApiVersion}"
	// The performance pack the launcher installs, downloaded by CI into test-mods/<project>
	productionRuntimeMods fileTree(dir: rootProject.file("test-mods/${project.name}"), include: '*.jar')
}

apply from: '../api-dump.gradle'
