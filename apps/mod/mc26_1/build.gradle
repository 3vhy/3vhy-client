plugins {
	id 'net.fabricmc.fabric-loom'
}

def minecraftVersion = '26.1.2'
def fabricApiVersion = '0.155.3+26.1.2'
ext.fabricApiVersion = fabricApiVersion

version = "${mod_version}+26.1"
group = 'dev.threevhy'
base { archivesName = 'threevhy-client' }

sourceSets {
	main {
		java { srcDir '../common/src/main/java' }
		resources { srcDir '../common/src/main/resources' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

processResources {
	def props = [
		version        : project.version,
		minecraft_range: '>=26.1 <26.2',
		java_version   : '25',
		discord_app_id : (System.getenv('THREEVHY_DISCORD_APP_ID') ?: project.findProperty('discord_app_id') ?: ''),
		gametest_entrypoint: providers.gradleProperty('gametest').isPresent()
				? ',\n\t\t"fabric-client-gametest": ["dev.threevhy.client.test.ThreevhyGameTest"]' : ''
	]
	inputs.properties props
	filesMatching(['fabric.mod.json', 'threevhy-build.properties']) {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

apply from: '../testing.gradle'

// Starts the real game with the mod (and its in-game test, with -Pgametest) under a virtual display
tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	jvmArgs.add('-Dfabric.client.gametest')
	jvmArgs.add('-Dfabric.client.gametest.disableNetworkSynchronizer=true')
	useXVFB = System.getenv('CI') != null
}
