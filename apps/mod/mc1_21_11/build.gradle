plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

def minecraftVersion = '1.21.11'
def fabricApiVersion = '0.141.6+1.21.11'
ext.fabricApiVersion = fabricApiVersion

version = "${mod_version}+${minecraftVersion}"
group = 'dev.eventide'
base { archivesName = 'eventide' }

sourceSets {
	main {
		java { srcDir '../common/src/main/java' }
		resources { srcDir '../common/src/main/resources' }
	}
	test {
		java { srcDir '../common/src/test/java' }
	}
}

loom {
	mixin {
		defaultRefmapName = 'eventide-refmap.json'
	}
}

dependencies {
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

processResources {
	def props = [
		version        : project.version,
		minecraft_range: '~1.21.11',
		java_version   : '21',
		discord_app_id : (System.getenv('EVENTIDE_DISCORD_APP_ID') ?: project.findProperty('discord_app_id') ?: ''),
		gametest_entrypoint: providers.gradleProperty('gametest').isPresent()
				? ',\n\t\t"fabric-client-gametest": ["dev.eventide.client.test.EventideGameTest"]' : ''
	]
	inputs.properties props
	filesMatching(['fabric.mod.json', 'eventide-build.properties']) {
		expand props
	}
}

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

apply from: '../testing.gradle'

// Starts the real game with the mod (and its in-game test, with -Pgametest) under a virtual display
tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	jvmArgs.add('-Dfabric.client.gametest')
	jvmArgs.add('-Dfabric.client.gametest.disableNetworkSynchronizer=true')
	// -PtestFocus=lyrics runs just that part of the in-game test, for quicker local checks
	def focus = providers.gradleProperty('testFocus').getOrElse('')
	if (!focus.isEmpty()) jvmArgs.add("-Deventide.testFocus=${focus}")
	useXVFB = System.getenv('CI') != null
}
