name: Build 3vhy mod

# Builds the in-game 3vhy Client mod for Minecraft 1.21.11 and 26.1.x, and plays a short
# scripted session in the real game for each version to check it works and take screenshots.
# Also used by the Windows build, which bundles the jars into the launcher.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_gametest:
        type: boolean
        default: false
  push:
    branches:
      - main
      - mod-dev
    paths:
      - 'apps/mod/**'
      - '.github/workflows/3vhy-mod.yml'

permissions:
  contents: write

jobs:
  mod:
    name: Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-3vhy-${{ hashFiles('apps/mod/**/*.gradle', 'apps/mod/gradle.properties', 'apps/mod/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-3vhy-

      - name: Build
        working-directory: apps/mod
        env:
          THREEVHY_DISCORD_APP_ID: ${{ vars.THREEVHY_DISCORD_APP_ID }}
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --continue --stacktrace 2>&1 | tee build.log

      - name: Report problems (1-30)
        if: failure()
        run: python3 .github/scripts/gradle-annotate.py apps/mod/build.log 0

      - name: Report problems (31-60)
        if: failure()
        run: python3 .github/scripts/gradle-annotate.py apps/mod/build.log 30

      - name: Collect jars
        run: |
          mkdir -p mod-jars
          cp apps/mod/mc1_21_11/build/libs/threevhy-client-*+1.21.11.jar mod-jars/threevhy-client-1.21.11.jar
          cp apps/mod/mc26_1/build/libs/threevhy-client-*+26.1.jar mod-jars/threevhy-client-26.1.jar
          ls -la mod-jars

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: 3vhy-mod
          path: mod-jars/*.jar
          if-no-files-found: error

  # The Music HUD reads Windows' media controls through a PowerShell script. On Windows, play a
  # fake song with a cover through those same media controls and check the script reads back the
  # song, its cover and the app's icon. Informational: it never blocks a build or a release.
  music-script:
    name: Music HUD script (Windows)
    if: ${{ inputs.skip_gametest != true }}
    runs-on: windows-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Play a fake song and read it back
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'music-report'
          New-Item -ItemType Directory -Force -Path $report | Out-Null
          $log = Join-Path $report 'result.txt'
          Add-Type -AssemblyName System.Drawing
          $cover = Join-Path $env:RUNNER_TEMP 'cover.png'
          $bitmap = New-Object System.Drawing.Bitmap 160, 90
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::FromArgb(255, 26, 79, 186))
          $graphics.FillRectangle([System.Drawing.Brushes]::White, 60, 25, 40, 40)
          $graphics.Dispose()
          $bitmap.Save($cover, [System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose()

          $player = Join-Path $env:RUNNER_TEMP 'fake-player.ps1'
          Set-Content -Path $player -Value @'
          param([string]$Cover)
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Runtime.WindowsRuntime
          $null = [Windows.Media.Playback.MediaPlayer, Windows.Media.Playback, ContentType = WindowsRuntime]
          $null = [Windows.Storage.StorageFile, Windows.Storage, ContentType = WindowsRuntime]
          $null = [Windows.Storage.Streams.RandomAccessStreamReference, Windows.Storage.Streams, ContentType = WindowsRuntime]
          $asTask = [System.WindowsRuntimeSystemExtensions].GetMethods() | Where-Object { $_.Name -eq 'AsTask' -and $_.GetParameters().Count -eq 1 -and $_.GetParameters()[0].ParameterType.Name -eq 'IAsyncOperation`1' } | Select-Object -First 1
          $file = $asTask.MakeGenericMethod([Windows.Storage.StorageFile]).Invoke($null, @([Windows.Storage.StorageFile]::GetFileFromPathAsync($Cover))).Result
          $mediaPlayer = [Windows.Media.Playback.MediaPlayer]::new()
          $mediaPlayer.CommandManager.IsEnabled = $false
          $controls = $mediaPlayer.SystemMediaTransportControls
          $controls.IsEnabled = $true
          $controls.IsPlayEnabled = $true
          $controls.IsPauseEnabled = $true
          $controls.PlaybackStatus = 'Playing'
          $updater = $controls.DisplayUpdater
          $updater.Type = 'Music'
          $updater.MusicProperties.Title = '3vhy CI Song'
          $updater.MusicProperties.Artist = '3vhy CI'
          $updater.Thumbnail = [Windows.Storage.Streams.RandomAccessStreamReference]::CreateFromFile($file)
          $updater.Update()
          Write-Output 'playing'
          Start-Sleep -Seconds 90
          '@
          $fake = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $player, '-Cover', $cover) -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'fake-out.txt') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'fake-err.txt')

          $script = 'apps/mod/common/src/main/resources/assets/threevhy/music/now-playing.ps1'
          $found = $null
          $lines = @()
          for ($i = 0; $i -lt 20 -and -not $found; $i++) {
            Start-Sleep -Seconds 2
            $out = powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Once 2>&1 | Out-String
            $line = ($out -split "`n" | Where-Object { $_.Trim().StartsWith('{') } | Select-Object -Last 1)
            $lines += "try $($i): $($out.Trim())"
            if ($line) {
              $json = $line | ConvertFrom-Json
              if ($json.title -eq '3vhy CI Song') { $found = $json }
            }
          }
          if (-not $fake.HasExited) { Stop-Process -Id $fake.Id -Force }
          $verdict = if (-not $found) { 'fake song not seen' } else {
            "song: $($found.title) / $($found.artist) / app $($found.app)`ncover: $(if ($found.art) { 'yes, ' + $found.art.Length + ' base64 chars' } else { 'no (' + $found.artError + ')' })`nicon: $(if ($found.icon) { 'yes, ' + $found.icon.Length + ' base64 chars' } else { 'no (' + $found.iconError + ')' })"
          }
          $fakeOut = Get-Content (Join-Path $env:RUNNER_TEMP 'fake-out.txt') -Raw -ErrorAction SilentlyContinue
          $fakeErr = Get-Content (Join-Path $env:RUNNER_TEMP 'fake-err.txt') -Raw -ErrorAction SilentlyContinue
          Set-Content -Path $log -Value ("$verdict`n`nfake player: $fakeOut $fakeErr`n`n" + ($lines -join "`n"))
          Write-Output "::notice title=Music HUD script::$($verdict -replace "`n", ' | ')"

      # The result goes to the ci-report/music-script branch, like the in-game test reports
      - name: Publish result
        if: always() && github.ref_type == 'branch'
        shell: bash
        run: |
          report="$RUNNER_TEMP/music-report"
          mkdir -p "$report"
          [ -f "$report/result.txt" ] || echo "The script step failed before writing a result" > "$report/result.txt"
          cd "$report"
          git init -q
          git checkout -q -b report
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Music script result for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" report:refs/heads/ci-report/music-script

  gametest:
    name: In-game test (${{ matrix.project }})
    if: ${{ inputs.skip_gametest != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [mc1_21_11, mc26_1]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-3vhy-test-${{ matrix.project }}-${{ hashFiles('apps/mod/**/*.gradle', 'apps/mod/gradle.properties', 'apps/mod/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-3vhy-test-${{ matrix.project }}-

      - name: Install virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri

      # Same mods the launcher adds to every 3vhy instance: Sodium, Lithium, FerriteCore,
      # Entity Culling and ImmediatelyFast, newest versions for this Minecraft version
      - name: Get the performance pack
        working-directory: apps/mod
        run: |
          case "${{ matrix.project }}" in
            mc1_21_11) mc=1.21.11 ;;
            mc26_1) mc=26.1.2 ;;
          esac
          dir="test-mods/${{ matrix.project }}"
          mkdir -p "$dir"
          for id in AANobbMI gvQqBUqZ uXXizFIs NNAgCjsB 5ZwdcRci; do
            url=$(curl -fsS "https://api.modrinth.com/v2/project/$id/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22$mc%22%5D" \
              | jq -r 'first(.[] | .files | (map(select(.primary)) + .)[0].url) // empty')
            if [ -n "$url" ]; then
              echo "::notice title=Performance pack::$(basename "$url")"
              curl -fsSL -o "$dir/$(basename "$url")" "$url"
            else
              echo "::notice title=Performance pack::no $mc version of $id"
            fi
          done

      - name: Play a test session
        working-directory: apps/mod
        run: |
          set -o pipefail
          ./gradlew :${{ matrix.project }}:dumpApi :${{ matrix.project }}:runProductionClientGameTest -Pgametest \
            --no-daemon --stacktrace 2>&1 | tee gametest.log

      - name: Report checks
        if: always()
        working-directory: apps/mod
        run: |
          log=${{ matrix.project }}/run/logs/latest.log
          if [ -f "$log" ]; then
            grep "3vhy-check" "$log" | sed 's/.*3vhy-check: /::notice title=3vhy check::/' || true
            grep -E "ERROR|Exception|Caused by|InvalidInjection" "$log" | head -n 10 | sed 's/^/::warning title=Game log::/' || true
          fi
          python3 ../../.github/scripts/gradle-annotate.py gametest.log 0 || true

      # Screenshots and logs go to a ci-report/<project> branch so they can be looked at
      # without a GitHub login (artifact downloads need one).
      - name: Publish report
        if: always() && github.ref_type == 'branch'
        run: |
          report="$RUNNER_TEMP/report"
          mkdir -p "$report/screenshots"
          dir=apps/mod/${{ matrix.project }}
          find "$dir/run" -name "*.png" -exec cp {} "$report/screenshots/" \; 2>/dev/null || true
          cp "$dir/run/logs/latest.log" "$report/" 2>/dev/null || true
          cp apps/mod/gametest.log "$report/" 2>/dev/null || true
          cp "$dir/build/api.txt" "$report/" 2>/dev/null || true
          cd "$report"
          git init -q
          git checkout -q -b report
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Test report for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" report:refs/heads/ci-report/${{ matrix.project }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.project }}
          path: apps/mod/${{ matrix.project }}/run/screenshots
          if-no-files-found: ignore
