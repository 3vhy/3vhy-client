name: Build Eventide (Windows)

# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0
# to build and publish a GitHub Release with the installer attached.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # The in-game Eventide mod, bundled into the launcher below
  mod:
    name: Eventide mod
    uses: ./.github/workflows/eventide-mod.yml
    with:
      skip_gametest: true

  build-windows:
    name: Windows installer
    needs: mod
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Respects rust-toolchain.toml, so the same Rust version as upstream is used
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (pnpm)
        run: corepack enable

      # The launcher's small Java helper is built with Gradle during the Rust build
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "Building Eventide $VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" apps/app/Cargo.toml
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" packages/app-lib/Cargo.toml
          node -e "const f='apps/app-frontend/package.json';const p=require('./'+f);p.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(p,null,'\t')+'\n')"
          cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Get the Eventide mod
        uses: actions/download-artifact@v4
        with:
          name: eventide-mod
          path: packages/app-lib/eventide-mod

      - name: Check the Eventide mod is there
        shell: bash
        run: |
          ls -la packages/app-lib/eventide-mod
          test -s packages/app-lib/eventide-mod/eventide-1.21.11.jar
          test -s packages/app-lib/eventide-mod/eventide-26.1.jar

      - name: Install dependencies
        run: pnpm install

      - name: Build installer
        env:
          # Optional: set a repository variable with your own Discord application ID
          # to turn on Discord Rich Presence ("Playing Eventide").
          EVENTIDE_DISCORD_APP_ID: ${{ vars.EVENTIDE_DISCORD_APP_ID || vars.THREEVHY_DISCORD_APP_ID }}
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter=@modrinth/app run tauri build --bundles nsis 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The interactive "Eventide Setup" wraps the installer built above
      - name: Build Eventide Setup
        shell: bash
        run: |
          mkdir -p dist
          INSTALLER="$(ls target/release/bundle/nsis/*-setup.exe | head -n 1)"
          cp "$INSTALLER" apps/setup/payload/eventide-installer.exe
          cp "$INSTALLER" "dist/Eventide Classic Installer.exe"
          # The same installer under its old name, so copies of 3vhy Client (which look for this name) can update to Eventide
          cp "$INSTALLER" "dist/3vhy Client Classic Installer.exe"
          cargo build --release -p eventide_setup
          cp target/release/eventide-setup.exe "dist/Eventide Setup.exe"

      # The in-game mod on its own too, for players who use another launcher (Prism, MultiMC, the
      # vanilla launcher with Fabric): one jar per Minecraft version
      - name: Add the standalone mod jars
        shell: bash
        run: |
          mkdir -p dist-mod
          cp packages/app-lib/eventide-mod/eventide-1.21.11.jar "dist-mod/eventide-1.21.11-${APP_VERSION}.jar"
          cp packages/app-lib/eventide-mod/eventide-26.1.jar "dist-mod/eventide-26.1-${APP_VERSION}.jar"
          ls -la dist-mod

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: eventide-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload standalone mod jars
        uses: actions/upload-artifact@v4
        with:
          name: eventide-mod-standalone
          path: dist-mod/*.jar
          if-no-files-found: error

      # Notes written for players can live in .github/release-notes/<tag>.md; they go first, above
      # GitHub's list of changes
      - name: Find the release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then echo "path=$file" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Eventide ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.exe
            dist-mod/*.jar
          generate_release_notes: true

      # How the build went (and the end of the build log) goes to the ci-report/windows branch,
      # so it can be checked without a GitHub login
      - name: Publish build report
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/windows-report"
          mkdir -p "$report"
          {
            echo "ref: $GITHUB_REF"
            echo "commit: $GITHUB_SHA"
            echo "status: ${{ job.status }}"
            echo "installers:"
            ls -la dist 2>/dev/null || echo "  none"
          } > "$report/status.txt"
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            grep -n -E "error(\[|:)|warning: unused|ERROR|failed" "$RUNNER_TEMP/build.log" | head -n 200 > "$report/problems.txt" || true
            tail -n 300 "$RUNNER_TEMP/build.log" > "$report/build-tail.log"
          fi
          cd "$report"
          git init -q
          git checkout -q -b report
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Windows build report for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" report:refs/heads/ci-report/windows
